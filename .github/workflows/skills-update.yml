name: Nightly Skills Matrix Update
on:
  schedule:
    - cron: '0 13 * * *' # 1 PM UTC daily
  workflow_dispatch: # Manual trigger

jobs:
  update-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install PyPDF2 python-docx
      
      - name: Download latest matrix from Supabase
        run: |
          curl -X POST ${{ secrets.SUPABASE_URL }}/functions/v1/sync-db-to-csv \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -o skills_master.csv
      
      - name: Process new JDs
        run: |
          if [ -d "data/jd_inbox" ] && [ "$(ls -A data/jd_inbox)" ]; then
            for jd in data/jd_inbox/*.txt; do
              python scripts/jd_to_cv_loop.py "$jd"
            done
          fi
      
      - name: Upload updated matrix to Supabase
        run: |
          curl -X POST ${{ secrets.SUPABASE_URL }}/functions/v1/sync-csv-to-db \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -F "file=@skills_master.csv"
      
      - name: Commit updated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update skills matrix from nightly run"

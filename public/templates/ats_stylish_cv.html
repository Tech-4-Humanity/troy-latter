<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troy Latter - CV</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    .match-score-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: linear-gradient(135deg, #059669, #047857);
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
    }
    
    .match-score-badge.score-high {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    
    .match-score-badge.score-medium {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }
    
    .match-score-badge.score-low {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }
    
    .match-score-badge .score {
      display: block;
      font-size: 32px;
      font-weight: bold;
      line-height: 1;
    }
    
    .match-score-badge .label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
      opacity: 0.9;
    }
    
    .certifications-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 15px;
    }
    
    .cert-category h3 {
      color: #065f46;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      border-bottom: 2px solid #10b981;
      padding-bottom: 4px;
    }
    
    .cert-category ul {
      list-style: none;
      padding-left: 0;
    }
    
    .cert-category li {
      padding: 4px 0 4px 16px;
      position: relative;
      font-size: 14px;
      color: #374151;
    }
    
    .cert-category li:before {
      content: "✓";
      position: absolute;
      left: 0;
      color: #10b981;
      font-weight: bold;
    }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.5;
            color: #2c3e50;
            background: #f8f9fa;
            padding: 20px 15px;
        }
        
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 1px 8px rgba(0,0,0,0.08);
            padding: 0;
        }
        
        .header {
            background: linear-gradient(135deg, #2d5f3f 0%, #3a7d52 100%);
            color: white;
            padding: 25px 30px;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .header .subtitle {
            font-size: 1.1em;
            opacity: 0.95;
            margin-bottom: 15px;
        }
        
        .contact-bar {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 0.9em;
            margin-top: 15px;
        }
        
        .contact-bar span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .summary {
            background: #f0f7f4;
            padding: 20px 30px;
            border-left: 3px solid #3a7d52;
            margin: 20px 30px;
            font-size: 0.95em;
        }
        
        .section {
            padding: 20px 30px;
        }
        
        .section-title {
            color: #2d5f3f;
            font-size: 1.3em;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #3a7d52;
            font-weight: 600;
        }
        
        .experience-item {
            margin-bottom: 20px;
        }
        
        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        
        .job-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #2d5f3f;
        }
        
        .company {
            font-weight: 600;
            color: #555;
            margin: 3px 0;
            font-size: 0.95em;
        }
        
        .date-location {
            text-align: right;
            color: #666;
            font-size: 0.85em;
        }
        
        .achievements {
            margin-top: 10px;
        }
        
        .achievements li {
            margin-bottom: 6px;
            padding-left: 18px;
            position: relative;
            font-size: 0.9em;
            line-height: 1.4;
        }
        
        .achievements li:before {
            content: "▸";
            position: absolute;
            left: 0;
            color: #3a7d52;
            font-weight: bold;
        }
        
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 15px;
        }
        
        .skill-category {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            border-left: 2px solid #3a7d52;
        }
        
        .skill-category h3 {
            color: #2d5f3f;
            margin-bottom: 8px;
            font-size: 1em;
        }
        
        .skill-category ul {
            list-style: none;
        }
        
        .skill-category li {
            padding: 3px 0;
            color: #555;
            font-size: 0.9em;
        }
        
        strong {
            color: #2d5f3f;
        }
        
        @media print {
            body {
                background: white;
                padding: 0;
                font-size: 10pt;
            }
            .container {
                box-shadow: none;
            }
            .header {
                padding: 20px 25px;
            }
            .section {
                padding: 15px 25px;
            }
            .summary {
                margin: 15px 25px;
                padding: 15px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        {{matchScore}}
        
        <div class="header">
            <h1>{{name}}</h1>
            <div class="subtitle">{{title}}</div>
            <div class="contact-bar">
                {{contact}}
            </div>
        </div>

        <div class="summary">
            {{summary}}
        </div>

        <div class="section">
            <h2 class="section-title">PROFESSIONAL EXPERIENCE</h2>
            {{experience}}
        </div>

        <div class="section">
            <h2 class="section-title">CORE COMPETENCIES</h2>
            {{skills}}
        </div>
        
        <div class="section">
            <h2 class="section-title">MICRO CREDENTIALS & TECHNICAL CERTIFICATIONS</h2>
            {{certifications}}
        </div>
    </div>
</body>
</html>
